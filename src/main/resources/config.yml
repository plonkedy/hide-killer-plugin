# =========================================
# HideKiller Configuration
# =========================================

# The exact death message shown for EVERY player death, no matter who or
# what killed them (PvP, mobs, fall damage, lava, etc). No placeholders —
# this literal text is shown every time.
# Supports MiniMessage color/formatting tags, e.g. <red>, <bold>, <white>
death-message: "<white>Player</white> has died"

# If true, prints a debug line to console every time a death message is replaced.
debug: false
